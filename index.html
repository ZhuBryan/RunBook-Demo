<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RunBook Embed Demo Mirror</title>
    <meta name="description" content="Exact mirror of the RunBook embed-demo experience." />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #020617;
        color: #e2e8f0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .mirror-shell {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .mirror-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(2, 6, 23, 0.98);
      }

      .mirror-header strong {
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      .mirror-header a {
        color: #a5b4fc;
        text-decoration: none;
        font-size: 12px;
      }

      .mirror-header a:hover {
        text-decoration: underline;
      }

      iframe {
        flex: 1 1 auto;
        width: 100%;
        border: 0;
        background: #020617;
      }
    </style>
  </head>
  <body>
    <div class="mirror-shell">
      <div class="mirror-header">
        <strong>RunBook `/embed-demo` Mirror</strong>
        <a href="https://runbook-main.vercel.app/embed-demo" target="_blank" rel="noopener noreferrer">Open original in new tab</a>
      </div>
      <iframe
        src="https://runbook-main.vercel.app/embed-demo"
        title="RunBook Embed Demo"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>
  </body>
</html>
